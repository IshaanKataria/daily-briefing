name: Daily Briefing

# The Hostbrr VPS was retired, so scheduling moved back to GitHub Actions on 2026-08-22.
# The original reason for leaving Actions (OAuth refresh tokens expiring on ephemeral
# runners) turned out to be wrong: the personal refresh token has stayed valid for
# months, so nothing needs to persist between runs.
#
# Actions cron is UTC-only and Melbourne shifts between UTC+10 and UTC+11, so this
# fires on all four candidate hours and briefing.py decides from Melbourne local time
# whether to actually run. Two of the four exit immediately as no-ops.
on:
  schedule:
    - cron: '0 21 * * *'   # 08:00 AEDT
    - cron: '0 22 * * *'   # 08:00 AEST
    - cron: '0 10 * * *'   # 21:00 AEDT
    - cron: '0 11 * * *'   # 21:00 AEST
  workflow_dispatch:
    inputs:
      mode:
        description: 'Briefing mode (manual runs bypass the local-time check)'
        required: true
        default: 'morning'
        type: choice
        options:
          - morning
          - evening

jobs:
  send-briefing:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install google-api-python-client google-auth-httplib2 google-auth-oauthlib anthropic

      - name: Write token files from secrets
        run: |
          echo '${{ secrets.TOKEN_PERSONAL }}' > token_personal.json
          echo '${{ secrets.TOKEN_UNI }}' > token_uni.json
          echo '${{ secrets.GOOGLE_CREDENTIALS }}' > credentials.json

      - name: Run briefing
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BRIEFING_TO_EMAIL: ${{ secrets.BRIEFING_TO_EMAIL }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python briefing.py --mode ${{ inputs.mode }}
          else
            python briefing.py
          fi
