name: Daily Briefing SMS

on:
  # Schedule disabled -- migrated to Hostbrr VPS cron (2026-04-06)
  # VPS handles morning (8am) and evening (9pm) briefings via /root/daily-briefing/run-briefing.sh
  workflow_dispatch:
    inputs:
      mode:
        description: 'Briefing mode'
        required: true
        default: 'morning'
        type: choice
        options:
          - morning
          - evening

jobs:
  send-briefing:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install google-api-python-client google-auth-httplib2 google-auth-oauthlib anthropic twilio

      - name: Write token files from secrets
        run: |
          echo '${{ secrets.TOKEN_PERSONAL }}' > token_personal.json
          echo '${{ secrets.TOKEN_UNI }}' > token_uni.json
          echo '${{ secrets.GOOGLE_CREDENTIALS }}' > credentials.json

      - name: Determine mode from schedule
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode }}" >> $GITHUB_OUTPUT
          else
            HOUR=$(date -u +%H)
            if [ "$HOUR" = "22" ]; then
              echo "mode=morning" >> $GITHUB_OUTPUT
            else
              echo "mode=evening" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Run briefing
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM_NUMBER: ${{ secrets.TWILIO_FROM_NUMBER }}
          TWILIO_TO_NUMBER: ${{ secrets.TWILIO_TO_NUMBER }}
        run: python briefing.py --mode ${{ steps.mode.outputs.mode }}
