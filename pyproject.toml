[project]
name = "daily-briefing"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "google-api-python-client>=2.0.0",
    "google-auth-httplib2>=0.1.0",
    "google-auth-oauthlib>=1.0.0",
    "anthropic>=0.40.0",
    "twilio>=9.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
